name: Component Tests

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-components:
    name: Test Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # GCC is pre-installed on ubuntu-latest — no setup needed

      - name: Make test runner executable
        run: chmod +x scripts/test-component.sh

      - name: Detect changed components
        id: detect-changes
        run: |
          BASE_REF="origin/${{ github.base_ref }}"
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            BASE_REF="HEAD~1"
          fi
          echo "Comparing against: $BASE_REF"

          CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          COMPONENTS=$(echo "$CHANGED_FILES" \
            | grep -iE '^(components|tests)/(c|java)/[CJ][0-9]{2}/' \
            | sed -E 's/^(components|tests)\///' \
            | awk -F/ '{print $1"/"$2}' \
            | sort -u || true)

          if [ -z "$COMPONENTS" ]; then
            echo "No component source or test files modified."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Components to test:"
            echo "$COMPONENTS"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "components<<EOF" >> $GITHUB_OUTPUT
            echo "$COMPONENTS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Run regression tests
        if: steps.detect-changes.outputs.has_changes == 'true'
        run: |
          FAILED=0
          while IFS= read -r item; do
            if [ -n "$item" ]; then
              echo "::group::Testing: $item"
              if ! timeout 120 ./scripts/test-component.sh "$item"; then
                echo "::error::FAILED: $item"
                FAILED=1
              else
                echo "PASSED: $item"
              fi
              echo "::endgroup::"
            fi
          done <<< "${{ steps.detect-changes.outputs.components }}"

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more regression test suites failed."
            exit 1
          fi
          echo "All affected components passed regression tests!"

      - name: Non-component changes
        if: steps.detect-changes.outputs.has_changes == 'false'
        run: |
          echo "Documentation or infrastructure changes only. No regression tests required."

